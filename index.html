<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 아이폰 앱 전용 설정 (웹앱 모드) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="대출계산기">

    <title>디딤돌 대출 & 이사 비용 계산기</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: var(--primary-color);
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            font-size: 1.3rem;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            height: 44px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
            -webkit-appearance: none;
        }
        button {
            width: 100%;
            height: 48px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            background-color: #1d4ed8;
        }
        .result-box {
            margin-top: 20px;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 15px;
            display: none;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #cbd5e1;
            font-size: 0.95rem;
        }
        .result-row:last-child {
            border-bottom: none;
        }
        .result-title {
            font-weight: 500;
        }
        .result-value {
            font-weight: bold;
            color: var(--primary-color);
            text-align: right;
        }
        .highlight {
            color: #dc2626 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏠 디딤돌 대출 계산기</h2>
    
    <div class="form-group">
        <label for="housePrice">집값 (만원)</label>
        <input type="number" id="housePrice" inputmode="numeric" placeholder="예: 50000 (5억인 경우)" value="50000">
    </div>

    <div class="form-group">
        <label for="interestRate">대출 금리 (%)</label>
        <input type="number" step="0.01" id="interestRate" inputmode="decimal" placeholder="예: 3.0" value="3.0">
    </div>

    <div class="form-group">
        <label for="loanPeriod">대출 기간 (년)</label>
        <select id="loanPeriod">
            <option value="10">10년</option>
            <option value="15">15년</option>
            <option value="20">20년</option>
            <option value="30" selected>30년</option>
        </select>
    </div>

    <div class="form-group">
        <label for="userType">가구 유형</label>
        <select id="userType">
            <option value="shinhon">신혼가구 (최대 3.2억 한도)</option>
            <option value="first">생애최초 일반가구 (최대 2.4억 한도)</option>
            <option value="normal">일반가구 (최대 2.0억 한도)</option>
        </select>
    </div>

    <button type="button" id="calcBtn">계산하기</button>

    <div class="result-box" id="resultBox">
        <div class="result-row">
            <span class="result-title">최대 대출 가능 금액</span>
            <span class="result-value" id="maxLoan">0 원</span>
        </div>
        <div class="result-row">
            <span class="result-title">매달 원리금 상환액</span>
            <span class="result-value" id="monthlyPayment">0 원</span>
        </div>
        <div class="result-row">
            <span class="result-title">필요 최소 순수 잔금</span>
            <span class="result-value" id="neededCash">0 원</span>
        </div>
        <div class="result-row">
            <span class="result-title">예상 복비 (상한)</span>
            <span class="result-value" id="brokerFee">0 원</span>
        </div>
        <div class="result-row">
            <span class="result-title">총 준비 권장 현금</span>
            <span class="result-value highlight" id="totalCash">0 원</span>
        </div>
        <div class="result-row" style="flex-direction: column; align-items: flex-start; gap: 5px; margin-top: 10px;">
            <span class="result-title">💡 자격 신청 가능 부부합산 소득 조건</span>
            <span id="incomeCondition" style="font-size: 0.85rem; color: #475569; line-height: 1.4;"></span>
        </div>
    </div>
</div>

<script>
document.getElementById('calcBtn').addEventListener('click', function() {
    calculate();
});

function calculate() {
    var housePriceInput = document.getElementById('housePrice').value;
    var interestRateInput = document.getElementById('interestRate').value;
    
    var priceMan = parseFloat(housePriceInput);
    var rate = parseFloat(interestRateInput);
    var years = parseInt(document.getElementById('loanPeriod').value, 10);
    var type = document.getElementById('userType').value;

    if (isNaN(priceMan) || isNaN(rate) || priceMan <= 0 || rate <= 0) {
        alert('집값과 금리를 올바르게 입력해주세요.');
        return;
    }

    var price = priceMan * 10000;
    var ltvLimit = price * 0.7;

    var maxCap = 200000000;
    var incomeText = "부부합산 연소득 6,000만원 이하 (순자산 5.11억원 이하)";

    if (type === 'shinhon') {
        maxCap = 320000000;
        incomeText = "부부합산 연소득 <b>8,500만원 이하</b> (순자산 5.11억원 이하)";
    } else if (type === 'first') {
        maxCap = 240000000;
        incomeText = "부부합산 연소득 <b>7,000만원 이하</b> (순자산 5.11억원 이하)";
    }

    var maxHousePrice = (type === 'shinhon') ? 600000000 : 500000000;
    if (price > maxHousePrice) {
        alert('선택하신 가구 유형의 디딤돌대출 대상 주택 가격 한도는 ' + (maxHousePrice / 100000000) + '억원 이하입니다.');
    }

    var finalLoan = Math.min(ltvLimit, maxCap);

    var monthlyRate = (rate / 100) / 12;
    var totalMonths = years * 12;
    
    var tempPow = Math.pow(1 + monthlyRate, totalMonths);
    var monthlyPayment = (finalLoan * monthlyRate * tempPow) / (tempPow - 1);

    var neededCash = price - finalLoan;

    var feeRate = 0.004;
    if (price < 50000000) feeRate = 0.006;
    else if (price < 200000000) feeRate = 0.005;

    var brokerFee = price * feeRate;
    var estimatedTax = price * 0.011;
    var totalCash = neededCash + brokerFee + estimatedTax + 2000000;

    document.getElementById('maxLoan').innerText = Math.floor(finalLoan).toLocaleString() + ' 원';
    document.getElementById('monthlyPayment').innerText = Math.floor(monthlyPayment).toLocaleString() + ' 원';
    document.getElementById('neededCash').innerText = Math.floor(neededCash).toLocaleString() + ' 원';
    document.getElementById('brokerFee').innerText = Math.floor(brokerFee).toLocaleString() + ' 원 (VAT 별도)';
    document.getElementById('totalCash').innerText = '약 ' + Math.floor(totalCash / 10000).toLocaleString() + ' 만원 (부대비용 포함)';
    document.getElementById('incomeCondition').innerHTML = incomeText;

    document.getElementById('resultBox').style.display = 'block';
}
</script>

</body>
</html>
